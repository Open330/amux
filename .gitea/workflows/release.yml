# amux release — build a signed, notarized amux-macos.dmg on a tag push.
#
# Reuses scripts/build-signed-dmg.sh (proven end-to-end producing the
# v0.1.0-alpha notarized release): it fetches the Developer ID cert + the
# App Store Connect API key from Vaultwarden at runtime into a temporary
# keychain (deleted on exit), builds the Apple Silicon Release unsigned, applies
# Developer ID with amux direct-distribution entitlements using the shared
# inside-out signer, bundles the pinned runtime (tmux 3.7b + muxad/muxa),
# creates the dmg, notarizes, verifies, and staples.
#
# RUNNER REQUIREMENTS (org infra):
#   - macOS runner with Xcode + an unlocked Bitwarden CLI session at
#     ~/.bw_session (see ~/.agents/VAULT.md). The Vault items are:
#     "Developer ID Application (Jiun Bae)" and
#     "App Store Connect API Key - file-stack".
#   - MUXA_REPO checked out for the pinned muxad/muxa release binaries.
#   - AMUX_SPARKLE_PUBLIC_KEY, AMUX_SPARKLE_PRIVATE_KEY,
#     AMUX_GITHUB_TOKEN, and AMUX_HOMEBREW_GITHUB_TOKEN configured as
#     repository secrets.
name: amux-release

on:
  push:
    tags: ["v*"]

jobs:
  build-sign-notarize:
    runs-on: [self-hosted, macos]
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
      MUXA_REPO: ${{ vars.MUXA_REPO }}
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup (submodules + GhosttyKit)
        run: ./scripts/setup.sh

      - name: Validate release secrets
        env:
          SPARKLE_PUBLIC_KEY: ${{ secrets.AMUX_SPARKLE_PUBLIC_KEY }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.AMUX_SPARKLE_PRIVATE_KEY }}
          GH_TOKEN: ${{ secrets.AMUX_GITHUB_TOKEN }}
          HOMEBREW_GITHUB_TOKEN: ${{ secrets.AMUX_HOMEBREW_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          : "${SPARKLE_PUBLIC_KEY:?AMUX_SPARKLE_PUBLIC_KEY secret is required}"
          : "${SPARKLE_PRIVATE_KEY:?AMUX_SPARKLE_PRIVATE_KEY secret is required}"
          : "${GH_TOKEN:?AMUX_GITHUB_TOKEN secret is required}"
          : "${HOMEBREW_GITHUB_TOKEN:?AMUX_HOMEBREW_GITHUB_TOKEN secret is required}"
          if [[ -z "${MUXA_REPO:-}" ]]; then
            export MUXA_REPO="$HOME/personal/muxa"
          fi
          [[ -d "$MUXA_REPO" ]] || { echo "MUXA_REPO not found: $MUXA_REPO" >&2; exit 1; }

      - name: Build, sign, notarize, and publish amux
        env:
          SPARKLE_PUBLIC_KEY: ${{ secrets.AMUX_SPARKLE_PUBLIC_KEY }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.AMUX_SPARKLE_PRIVATE_KEY }}
          GH_TOKEN: ${{ secrets.AMUX_GITHUB_TOKEN }}
          HOMEBREW_GITHUB_TOKEN: ${{ secrets.AMUX_HOMEBREW_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          export MUXA_REPO="${MUXA_REPO:-$HOME/personal/muxa}"
          ./scripts/build-sign-upload.sh "${{ github.ref_name }}"
